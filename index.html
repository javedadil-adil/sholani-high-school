var DB = null;
function saveDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); return true; }catch(e){ toast("Storage full / ذخیره ډکه ده"); return false; } }
function audit(action, module, record){
  if(!DB) return;
  DB.audit.unshift({id:uid("A"), time:nowStr(), user: UI.user? UI.user.username : "system", action:action, module:module, record:record||""});
  if(DB.audit.length>800) DB.audit.length=800;
}
function subjName(s){ if(!s) return ""; return UI.lang==="en"? s.nameEn : (UI.lang==="fa"? s.nameFa : s.namePs); }
function findStudent(id){ return DB.students.find(function(x){return x.id===id;}); }
function findStaff(id){ return DB.staff.find(function(x){return x.id===id;}); }
function findSubject(id){ return DB.subjects.find(function(x){return x.id===id;}); }
function findExam(id){ return DB.exams.find(function(x){return x.id===id;}); }
function activeStudents(){ return DB.students.filter(function(s){return s.status==="Active";}); }
function classKey(g,sec){ return g+"-"+sec; }
function studentClasses(){ var set={}; activeStudents().forEach(function(s){ set[classKey(s.grade,s.section)]=1; }); return Object.keys(set); }

function loadDB(){
  var raw=null;
  try{ raw=localStorage.getItem(DB_KEY); }catch(e){}
  if(raw){ try{ DB=JSON.parse(raw); }catch(e){ DB=null; } }
  if(!DB || !DB.settings){ DB=seedDB(); audit("create","system","Seed data loaded"); saveDB(); }
  /* v6 ONLINE: ONLY the manager exists. On load, remove every other saved
     account (headteacher, teacher, exam, guardian, user, principal, admin)
     and migrate the manager password from the old offline passwords
     ("123" / "sholani123") to the online password 6274470012, so manager
     login can never fail. Other accounts are NOT recreated. A password the
     manager changed himself (not 123) is left alone. The password never
     appears on any page of the site UI — only in the Pashto guide file. */
  if(DB && DB.users){
    var _mgr=DB.users.find(function(u){ return u.username==="manager"; });
    var _fix=false;
    if(DB.users.length!==1 || !_mgr) _fix=true;
    if(_mgr && (_mgr.password==="123" || _mgr.password==="sholani123")){ _mgr.password="6274470012"; _fix=true; }
    if(_fix){ DB.users=[{id:(_mgr&&_mgr.id)||"U1", username:"manager", password:"6274470012", name:"مدیر", role:"manager", active:true, studentId:null, classes:[]}]; saveDB(); }
    if(!DB.roles || DB.roles.length!==1 || DB.roles[0].name!=="manager"){ DB.roles=[{id:"R1", name:"manager", label:"مدیر (Manager)", perms:allPerms()}]; saveDB(); }
  /* Developer card defaults (v6.1): older saved settings may lack these fields. */
  if(DB && DB.settings){ var _ds=defaultSettings(); var _dc=false; ["developerName","developerPhoto","developerFather_ps","developerFather_fa","developerFather_en","developerEdu_ps","developerEdu_fa","developerEdu_en"].forEach(function(k){ if(DB.settings[k]===undefined){ DB.settings[k]=_ds[k]; _dc=true; } }); if(_dc) saveDB(); }
  }
  /* Daily auto-backup snapshot — ورځنی اتومات بېک‌اپ */
  try{
    var bkKey="sholani_school_autobackup_"+todayStr();
    if(!localStorage.getItem(bkKey)){ localStorage.setItem(bkKey, JSON.stringify(DB)); DB.backups.unshift({id:uid("BK"), time:nowStr(), note:"Auto daily backup", size:JSON.stringify(DB).length}); if(DB.backups.length>15) DB.backups.length=15; saveDB(); }
  }catch(e){}
}

function devCardHTML(){
  var s=DB.settings;

    ? '<img class="dev-photo" src="'+src+'" alt="">'
    : '<span class="dev-photo-ph">ج ع</span>';
  var father = s["developerFather_"+UI.lang] || s.developerFather_ps || "";
  var edu = s["developerEdu_"+UI.lang] || s.developerEdu_ps || "";
  return '<div class="card mt dev-card">'
    /* No heading inside the card itself — the section heading above it (in pubAbout) is the title. */
    +'<div class="dev-photo-wrap">'+photo+'</div>'
    +'<div class="dev-name">'+esc(s.developerName||"جاوید عادل / Javed Adil")+'</div>'
    +'<div class="dev-line"><span class="dev-lbl">'+esc(t("father"))+'</span><span>'+esc(father)+'</span></div>'
    +'<div class="dev-line"><span class="dev-lbl">'+esc(t("education"))+'</span><span>'+esc(edu)+'</span></div>'
    +'</div>';
}
function pubAbout(){ return '<div class="page-hero">'+logoLockupHTML(52)+'<div><h2>'+esc(t("about"))+'</h2><div class="sub">Sholani High School — '+esc(DB.settings.address)+'</div></div></div><div class="card mt"><p style="white-space:pre-line;font-size:1.05rem;line-height:1.9">'+esc(pubText("about"))+'</p></div><div class="dev-section"><h2 class="section-title" style="margin-top:0">'+esc(t("devTitle"))+'</h2>'+devCardHTML()+'</div><div class="card mt"><h3>'+esc(t("history"))+'</h3><p style="white-space:pre-line;font-size:1.05rem;line-height:1.9">'+esc(pubText("history"))+'</p></div>'; }

function dashAnnHTML(){ var list=(typeof ONLINE!=="undefined" && ONLINE.shared && ONLINE.shared.announcements && ONLINE.shared.announcements.length)? ONLINE.shared.announcements.slice(0,3) : DB.announcements.filter(function(a){return a.published;}).slice(0,3); if(!list.length) return '<span class="muted">'+esc(t("noData"))+'</span>'; return list.map(function(a){ var ti=onlineLang(a,"title")||a.title; var de=onlineLang(a,"body")||a.desc||""; var dt=(a.created_at||a.date||"").slice(0,10); return '<div class="timeline-item"><strong>'+esc(ti)+'</strong><div class="small muted">'+esc(dt)+'</div><div class="small">'+esc(de)+'</div></div>'; }).join(""); }

}

  return '<h2 class="section-title">'+esc(t("teachers"))+'</h2><div class="grid c3">'+list.filter(function(x){return x.type==="teacher";}).map(card).join("")+'</div>'

function pubClasses(){
  var rows=DB.settings.activeGrades.map(function(g){ var cnt=activeStudents().filter(function(s){return s.grade===g;}).length; var secs=DB.settings.sections.map(function(sec){ var c=activeStudents().filter(function(s){return s.grade===g&&s.section===sec;}).length; return sec+": "+c; }).join(" · "); return '<tr><td>'+esc(t("grade"))+' '+g+'</td><td>'+cnt+'</td><td>'+esc(secs)+'</td></tr>'; }).join("");
  return '<h2 class="section-title">'+esc(t("classes"))+' 1–12</h2>'+strip3(miniStat("g1","students", activeStudents().length, t("totalStudents"), ""), miniStat("g2","classes", studentClasses().length, t("activeClasses"), ""), miniStat("g3","teachers", (DB.staff.filter(function(x){return x.type==="teacher"&&x.status==="Active";}).length), t("totalTeachers"), ""))+'<div class="tablewrap"><table><tr><th>'+esc(t("grade"))+'</th><th>'+esc(t("totalStudents"))+'</th><th>'+esc(t("sectionsLbl"))+'</th></tr>'+rows+'</table></div>';
}
function pubSubjects(){
  var rows=DB.subjects.filter(function(s){return s.active;}).map(function(s){ return '<tr><td>'+esc(subjName(s))+'</td><td>'+s.grades.join(", ")+'</td><td>'+s.max+'</td><td>'+s.pass+'</td></tr>'; }).join("");
  return '<h2 class="section-title">'+esc(t("subjects"))+'</h2><div class="card mb"><p>'+esc(t("curriculumNote"))+'</p></div><div class="tablewrap"><table><tr><th>'+esc(t("subject"))+'</th><th>'+esc(t("grade"))+'</th><th>'+esc(t("maxMarks"))+'</th><th>'+esc(t("passingMarks"))+'</th></tr>'+rows+'</table></div>';
}

}
function ttEditCell(d,p){ if(!guard("timetable","edit")) return; var g=+ttSel.grade, sec=ttSel.section; var e=DB.timetable.find(function(x){return x.grade===g&&x.section===sec&&x.day===d&&x.period===p;}); var dEl=$("#ttDay"), pEl=$("#ttPeriod"); if(dEl) dEl.value=d; if(pEl) pEl.value=p; if(e){ var sEl=$("#ttSubject"); if(sEl) sEl.value=e.subjectId; var tEl=$("#ttTeacher"); if(tEl) tEl.value=e.teacherId; var shEl=$("#ttShift"); if(shEl) shEl.value=e.shift||"morning"; var subEl=$("#ttSub"); if(subEl) subEl.value=e.substitute||""; } var f=$("#ttFormCard"); if(f) f.scrollIntoView({behavior:"smooth", block:"center"}); toast(t("editSlot")); }
function ttGridHTML(g, sec, editable){
  var rows="";
  for(var p=1;p<=6;p++){ var cells=""; for(var d=0; d<6; d++){ var e=DB.timetable.find(function(x){return x.grade===g&&x.section===sec&&x.day===d&&x.period===p;}); var inner=e? '<strong>'+esc(subjName(findSubject(e.subjectId)))+'</strong><br><span class="small muted">'+esc((findStaff(e.teacherId)||{}).name||"")+(e.substitute? '<br>'+esc(t("substitute"))+': '+esc(e.substitute):"")+'</span>' : '<span class="muted">—</span>'; cells+='<td>'+(editable? '<button class="ttcell" title="'+esc(t("editSlot"))+'" onclick="ttEditCell('+d+','+p+')">'+inner+'</button>' : inner)+'</td>'; } rows+='<tr><th>'+esc(t("period"))+' '+p+'</th>'+cells+'</tr>'; }
  var head='<tr><th></th>'+[0,1,2,3,4,5].map(function(d){return '<th>'+esc(dayName(d))+'</th>';}).join("")+'</tr>';
  return '<div class="tablewrap tt-grid"><table>'+head+rows+'</table></div><p class="small muted">'+esc(t("workingDays"))+' · '+esc(t("period"))+': '+(DB.settings.periodMinutes||45)+' '+esc(t("minutes"))+'</p>';
}

/* v6.3 MOBILE-ONLY: label every table cell with its column header, so the
   phone layout can show each table as stacked cards (CSS at the end of
   <style>). Runs after every render and after every modal opens. */
function labelTables(){
  $$(".tablewrap table").forEach(function(tb){
    var rows=$$("tr", tb); if(!rows.length) return;
    var first=rows[0];
    if(!first.querySelector("th")) return;
    first.classList.add("tbl-head");
    var heads=$$("th,td", first).map(function(c){ return c.textContent.trim(); });
    rows.slice(1).forEach(function(tr){
      $$("th,td", tr).forEach(function(cell, i){
        if(cell.tagName==="TD"){ if(cell.colSpan>1) return; if(heads[i]) cell.setAttribute("data-label", heads[i]); }
        else cell.classList.add("tbl-rowhead");
      });
    });
  });
}

function hashCode(str){ var h=0; for(var i=0;i<str.length;i++){ h=((h<<5)-h+str.charCodeAt(i))|0; } return Math.abs(h); }
function verifyCode(id){ return "SHL-"+String(hashCode(id)%100000).padStart(5,"0"); }
function drawQR(canvas, text){
  var ctx=canvas.getContext("2d"); var N=25, cell=canvas.width/N; var h=hashCode(text);
  ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.width); ctx.fillStyle="#14231a";
  function finder(x,y){ ctx.fillRect(x*cell,y*cell,7*cell,7*cell); ctx.fillStyle="#fff"; ctx.fillRect((x+1)*cell,(y+1)*cell,5*cell,5*cell); ctx.fillStyle="#14231a"; ctx.fillRect((x+2)*cell,(y+2)*cell,3*cell,3*cell); }
  var seed=h;
  function rnd(){ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; }
  for(var y=0;y<N;y++) for(var x=0;x<N;x++){ var inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9); if(!inF && rnd()>0.52) ctx.fillRect(x*cell,y*cell,cell,cell); }
  finder(0,0); finder(N-7,0); finder(0,N-7);
}

var attSel={date:todayStr(), grade:"", section:"A", mode:"daily"};
function viewAttendance(){
  var classes=studentClasses();
  if(!attSel.grade && classes.length) attSel.grade=classes[0].split("-")[0];
  var g=+attSel.grade, sec=attSel.section;
  var rec=DB.attendance.find(function(a){return a.date===attSel.date&&a.grade===g&&a.section===sec;});
  var studs=activeStudents().filter(function(s){return s.grade===g&&s.section===sec;});
  var statuses=["Present","Absent","Late","Excused"];
  var rows=studs.map(function(s){ var cur=rec? (rec.records[s.id]||"Present"):"Present"; return '<tr><td><div class="row">'+avatarHTML(s,"sm")+'<span>'+esc(s.name)+'</span></div></td><td>'+esc(s.id)+'</td><td><select class="inline attSel" data-sid="'+s.id+(can("attendance","edit")?"":" disabled")+'">'+statuses.map(function(st2){return '<option value="'+st2+'" '+(cur===st2?"selected":"")+'>'+esc(t(st2.toLowerCase()))+'</option>';}).join("")+'</select></td></tr>'; }).join("");
  var monthRecs=DB.attendance.filter(function(a){ return a.date.indexOf(attSel.date.slice(0,7))===0; });
  var tot=0, pres=0, abs=0; monthRecs.forEach(function(a){ Object.keys(a.records).forEach(function(k){ tot++; if(a.records[k]==="Absent") abs++; else pres++; }); });
  var mpct= tot? Math.round(pres/tot*100):0;
  return '<h2 class="mb">'+esc(t("attendance"))+'</h2>'
  +'<div class="tabs"><button class="'+(attSel.mode==="daily"?"on":"")+'" onclick="attSel.mode=\'daily\';renderApp()">'+esc(t("daily"))+'</button><button class="'+(attSel.mode==="monthly"?"on":"")+'" onclick="attSel.mode=\'monthly\';renderApp()">'+esc(t("monthly"))+'</button><button class="'+(attSel.mode==="staff"?"on":"")+'" onclick="attSel.mode=\'staff\';renderApp()">'+esc(t("staffAtt"))+'</button></div>'
  +(attSel.mode==="staff"? staffAttHTML() :
    '<div class="card mb"><div class="row"><input class="inline" type="date" value="'+attSel.date+'" onchange="attSel.date=this.value;renderApp()">'
    +'<select class="inline" onchange="attSel.grade=this.value;renderApp()">'+classes.map(function(c){var p=c.split("-"); return '<option value="'+p[0]+'" '+(attSel.grade===p[0]?"selected":"")+'>'+esc(t("grade"))+' '+p[0]+'</option>';}).join("")+'</select>'
    +'<select class="inline" onchange="attSel.section=this.value;renderApp()">'+DB.settings.sections.map(function(s){return '<option '+(attSel.section===s?"selected":"")+'>'+s+'</option>';}).join("")+'</select>'
    +(rec? '<span class="badge">'+esc(t("enteredBy"))+': '+esc(rec.by)+(rec.reason? ' · '+esc(rec.reason):"")+'</span>':"")+'</div>'
    +(rec? '<div class="row mt"><input id="attReason" placeholder="'+esc(t("reason"))+' *" style="flex:1;min-width:180px"></div>':"")
    +'</div>'
    +'<div class="grid c3 mb"><div class="card stat"><div class="num">'+mpct+'%</div><div class="lbl">'+esc(t("monthly"))+' — '+esc(t("todayAttendance"))+'</div></div><div class="card stat"><div class="num">'+pres+'</div><div class="lbl">'+esc(t("present"))+'</div></div><div class="card stat"><div class="num">'+abs+'</div><div class="lbl">'+esc(t("absent"))+'</div></div></div>'
    +'<div class="tablewrap"><table><tr><th>'+esc(t("name"))+'</th><th>ID</th><th>'+esc(t("status"))+'</th></tr>'+(rows||'<tr><td colspan="3" class="muted">'+esc(t("noData"))+'</td></tr>')+'</table></div>'
    +(can("attendance","create")||can("attendance","edit")? '<button class="btn mt" onclick="saveAttendance()">'+esc(t("submit"))+'</button>':"")
  );
}
function saveAttendance(){ if(!guard("attendance","edit")) return;
  var g=+attSel.grade, sec=attSel.section;
  if(!teacherClassOK(g,sec)){ toast(t("noPermission")); return; }
  var existing=DB.attendance.find(function(a){return a.date===attSel.date&&a.grade===g&&a.section===sec;});
  var reason="";
  if(existing){ reason=($("#attReason")? $("#attReason").value.trim():""); if(!reason){ toast(t("reason")+" *"); return; } }
  var records={}; $$(".attSel").forEach(function(sel){ records[sel.getAttribute("data-sid")]=sel.value; });
  if(existing){ existing.records=records; existing.reason=reason; existing.by=UI.user.username; audit("edit","attendance",attSel.date+" "+g+"-"+sec+" ("+reason+")"); }
  else{ DB.attendance.push({id:uid("ATT"), date:attSel.date, grade:g, section:sec, records:records, by:UI.user.username, reason:""}); audit("create","attendance",attSel.date+" "+g+"-"+sec); }
  saveDB(); toast(t("saved")); renderApp();
}

function ttGridPrint(){ return '<h2 style="text-align:center;font-family:Tahoma">'+esc(schoolName())+' — '+esc(t("timetable"))+' '+esc(t("grade"))+' '+ttSel.grade+'-'+ttSel.section+'</h2>'+ttGridHTML(+ttSel.grade, ttSel.section, false); }
function addTT(){
  if(!guard("timetable","create")) return;
  var g=+ttSel.grade, sec=ttSel.section, day=+$("#ttDay").value, period=+$("#ttPeriod").value, teacherId=$("#ttTeacher").value;
  var clash=DB.timetable.find(function(e){ return e.teacherId===teacherId && e.day===day && e.period===period && !(e.grade===g&&e.section===sec); });
  if(clash){ toast(t("conflict")+" — "+(findStaff(teacherId)||{}).name+" @ "+esc(t("grade"))+" "+clash.grade+"-"+clash.section); return; }
  DB.timetable=DB.timetable.filter(function(e){ return !(e.grade===g&&e.section===sec&&e.day===day&&e.period===period); });
  DB.timetable.push({id:uid("TT"), grade:g, section:sec, day:day, period:period, subjectId:$("#ttSubject").value, teacherId:teacherId, shift:$("#ttShift").value, substitute:$("#ttSub").value.trim()});
  audit("create","timetable",g+"-"+sec+" "+dayName(day)+" P"+period); saveDB(); toast(t("saved")); renderApp();
}
function clearTTSlot(){
  if(!guard("timetable","delete")) return;
  var day=+$("#ttDay").value, period=+$("#ttPeriod").value;
  askCheck(t("timetable")+" "+dayName(day)+" P"+period, function(ok){ if(!ok) return; DB.timetable=DB.timetable.filter(function(e){ return !(e.grade===+ttSel.grade&&e.section===ttSel.section&&e.day===day&&e.period===period); }); audit("delete","timetable",ttSel.grade+"-"+ttSel.section); saveDB(); renderApp(); });
}

/* ================= ازموینې او پایلې — Exams, marks, report cards ================= */
var WF=["Entered","Reviewed","Verified","Approved","Published"];
function wfLabel(s){ var m={Entered:"entered",Reviewed:"reviewed",Verified:"verified",Approved:"approved",Published:"published"}; return t(m[s]||"entered"); }
var exSel={examId:"", grade:"", subjectId:""};
function viewExams(){
  if(!exSel.examId && DB.exams.length) exSel.examId=DB.exams[0].id;
  var examRows=DB.exams.map(function(e){ return '<tr><td>'+esc(e.namePs)+' / '+esc(e.nameEn)+'</td><td>'+esc(e.year)+'</td><td>'+esc(e.start)+' → '+esc(e.end)+'</td><td>'+e.grades.join(", ")+'</td><td class="nowrap">'+(can("exams","edit")?'<button class="btn small" onclick="examForm(\''+e.id+'\')">'+esc(t("edit"))+'</button>':"")+' '+(can("exams","delete")?'<button class="btn small danger" onclick="deleteExam(\''+e.id+'\')">'+esc(t("del"))+'</button>':"")+'</td></tr>'; }).join("");
  var ex=findExam(exSel.examId);
  var marksHTML="";
  if(ex){
    if(!exSel.grade) exSel.grade=ex.grades[0];
    if(!exSel.subjectId){ var sj=DB.subjects.find(function(s){return s.active;}); exSel.subjectId=sj? sj.id:""; }
    var subj=findSubject(exSel.subjectId);
    var studs=activeStudents().filter(function(s){ return s.grade===+exSel.grade && (UI.user.role!=="teacher" || teacherClassOK(s.grade,s.section)); });
    var rows=studs.map(function(s){ var m=DB.marks.find(function(x){return x.examId===ex.id&&x.studentId===s.id&&x.subjectId===exSel.subjectId;}); var locked=!can("exams","edit") || (m && (m.status==="Approved"||m.status==="Published") && UI.user.role==="teacher");
      return '<tr><td>'+esc(s.name)+'</td><td>'+esc(s.id)+'</td><td><input type="number" min="0" max="'+(subj?subj.max:100)+'" class="inline markIn" data-sid="'+s.id+'" value="'+(m? m.score:"")+'" '+(locked?"disabled":"")+' style="width:90px"></td><td>'+(m? '<span class="badge">'+esc(wfLabel(m.status))+'</span>': '<span class="badge warn">'+esc(t("missingMarks"))+'</span>')+'</td></tr>'; }).join("");
    var allMs=DB.marks.filter(function(m){return m.examId===ex.id;});
    var wfBtns="";
    if(allMs.length){
      var cur=allMs[0].status; var idx=WF.indexOf(cur);
      if(idx<WF.length-1){ var next=WF[idx+1]; var actFor={Reviewed:"approve",Verified:"approve",Approved:"approve",Published:"publish"}; var need=next==="Published"?"publish":"approve";
        wfBtns='<div class="card mt"><h3>'+esc(t("workflow"))+': '+WF.map(function(w){return esc(wfLabel(w));}).join(" → ")+'</h3><p class="small muted">'+esc(t("status"))+': '+esc(wfLabel(cur))+' ('+allMs.length+' '+esc(t("marks"))+')</p>'+(can("exams",need)? '<button class="btn gold" onclick="advanceWF(\''+ex.id+'\',\''+next+'\')">'+esc(next==="Published"?t("publish"):t("approve"))+' → '+esc(wfLabel(next))+'</button>':'<span class="badge warn">'+esc(t("noPermission"))+'</span>')+'</div>';
      } else wfBtns='<div class="card mt"><span class="badge ok">'+esc(wfLabel("Published"))+'</span></div>';
    }
    marksHTML='<div class="card mt"><h3>'+esc(t("enterMarks"))+' — '+esc(examName(ex))+'</h3><div class="row mb">'
      +'<select class="inline" onchange="exSel.examId=this.value;exSel.grade=\'\';renderApp()">'+DB.exams.map(function(e){return '<option value="'+e.id+'" '+(exSel.examId===e.id?"selected":"")+'>'+esc(examName(e))+' ('+esc(e.year)+')</option>';}).join("")+'</select>'
      +'<select class="inline" onchange="exSel.grade=this.value;renderApp()">'+ex.grades.map(function(g){return '<option value="'+g+'" '+(exSel.grade==g?"selected":"")+'>'+esc(t("grade"))+' '+g+'</option>';}).join("")+'</select>'
      +'<select class="inline" onchange="exSel.subjectId=this.value;renderApp()">'+DB.subjects.filter(function(s){return s.active;}).map(function(s){return '<option value="'+s.id+'" '+(exSel.subjectId===s.id?"selected":"")+'>'+esc(subjName(s))+' (max '+s.max+')</option>';}).join("")+'</select></div>'
      +'<div class="tablewrap"><table><tr><th>'+esc(t("name"))+'</th><th>ID</th><th>'+esc(t("marks"))+'</th><th>'+esc(t("status"))+'</th></tr>'+rows+'</table></div>'
      +(can("exams","create")||can("exams","edit")? '<button class="btn mt" onclick="saveMarks()">'+esc(t("save"))+'</button>':"")
      +' <button class="btn ghost mt" onclick="reportCardPicker()">'+esc(t("reportCard"))+'</button></div>'+wfBtns;
  }
  return '<div class="row spread mb"><h2>'+esc(t("exams"))+'</h2>'+(can("exams","create")?'<button class="btn gold btn-add" onclick="examForm()">+ '+esc(t("addExam"))+'</button>':"")+'</div>'
  +'<div class="tablewrap"><table><tr><th>'+esc(t("exam"))+'</th><th>'+esc(t("year"))+'</th><th>'+esc(t("date"))+'</th><th>'+esc(t("grade"))+'</th><th></th></tr>'+examRows+'</table></div>'+marksHTML;
}
function examForm(id){
  var e=id? findExam(id):null; if(!guard("exams", e?"edit":"create")) return;
  var v=function(k){ return e? esc(e[k]||""):""; };
  openModal('<h3>'+(e?esc(t("edit")):esc(t("addExam")))+'</h3><div class="form-grid">'
  +'<div><label>'+esc(t("exam"))+' (پښتو) *</label><input id="ex_ps" value="'+v("namePs")+'"></div>'
  +'<div><label>'+esc(t("exam"))+' (دری)</label><input id="ex_fa" value="'+v("nameFa")+'"></div>'
  +'<div><label>'+esc(t("exam"))+' (English)</label><input id="ex_en" value="'+v("nameEn")+'"></div>'
  +'<div><label>'+esc(t("year"))+'</label><input id="ex_year" value="'+(e?esc(e.year):esc(DB.settings.currentYear))+'"></div>'
  +'<div><label>'+esc(t("date"))+' — Start</label><input id="ex_start" value="'+v("start")+'" placeholder="1405-04-01"></div>'
  +'<div><label>'+esc(t("date"))+' — End</label><input id="ex_end" value="'+v("end")+'" placeholder="1405-04-15"></div>'
  +'<div><label>'+esc(t("grade"))+' (1,5,10)</label><input id="ex_grades" value="'+(e? e.grades.join(","):"")+'"></div></div>'
  +'<div class="row mt"><button class="btn" onclick="saveExam('+(e?"'"+e.id+"'":"null")+')">'+esc(t("save"))+'</button><button class="btn ghost" onclick="closeModal()">'+esc(t("cancel"))+'</button></div>');
}
function saveExam(id){ if(!guard("exams", id?"edit":"create")) return;
  var ps=$("#ex_ps").value.trim(); if(!ps){ toast(t("required")); return; }
  var grades=$("#ex_grades").value.split(",").map(function(x){return +x.trim();}).filter(function(x){return x>=1&&x<=12;});
  var data={namePs:ps, nameFa:$("#ex_fa").value.trim()||ps, nameEn:$("#ex_en").value.trim()||ps, year:$("#ex_year").value.trim()||DB.settings.currentYear, start:$("#ex_start").value.trim(), end:$("#ex_end").value.trim(), grades:grades.length?grades:[1]};
  if(id){ Object.assign(findExam(id), data); audit("edit","exams",id); } else { data.id=uid("EXM"); DB.exams.push(data); audit("create","exams",data.id); }
  saveDB(); closeModal(); toast(t("saved")); renderApp();
}
function deleteExam(id){ if(!guard("exams","delete")) return; askCheck(t("exams")+": "+id, function(ok){ if(!ok) return; DB.exams=DB.exams.filter(function(x){return x.id!==id;}); DB.marks=DB.marks.filter(function(m){return m.examId!==id;}); audit("delete","exams",id); saveDB(); renderApp(); }); }
function saveMarks(){ if(!guard("exams","edit")) return;
  var ex=findExam(exSel.examId); var subj=findSubject(exSel.subjectId); if(!ex||!subj) return;
  var bad=false;
  $$(".markIn").forEach(function(inp){
    var sid=inp.getAttribute("data-sid"); var val=inp.value.trim(); if(val==="") return;
    var sc=+val; if(isNaN(sc)||sc<0||sc>subj.max){ bad=true; inp.style.borderColor="var(--danger)"; return; }
    var m=DB.marks.find(function(x){return x.examId===ex.id&&x.studentId===sid&&x.subjectId===subj.id;});
    if(m){ if(m.status==="Approved"||m.status==="Published"){ if(UI.user.role==="teacher"){ bad=true; } else { m.score=sc; audit("edit","exams","mark "+sid); } } else { m.score=sc; m.by=UI.user.username; } }
    else DB.marks.push({id:uid("M"), examId:ex.id, studentId:sid, subjectId:subj.id, score:sc, status:"Entered", remarks:"", by:UI.user.username});
  });
  if(bad){ toast(t("maxMarks")+": "+subj.max+" / "+t("noPermission")); return; }
  audit("create","exams","marks "+examName(ex)+" "+subjName(subj)); saveDB(); toast(t("saved")); renderApp();
}
function advanceWF(examId, next){
  var need= next==="Published"? "publish":"approve";
  if(!guard("exams", need)) return;
  DB.marks.forEach(function(m){ if(m.examId===examId) m.status=next; });
  audit(next==="Published"?"publish":"approve","exams",examId+" → "+next); saveDB(); toast(t("saved")); renderApp();
}
function resultSummary(studentId, examId){
  var ms=DB.marks.filter(function(m){return m.examId===examId&&m.studentId===studentId;});
  var got=0, max=0; ms.forEach(function(m){ var s=findSubject(m.subjectId); got+=m.score; max+= s? s.max:100; });
  var pct= max? Math.round(got/max*1000)/10 : 0;
  return {marks:ms, got:got, max:max, pct:pct, pass: ms.length>0 && ms.every(function(m){ var s=findSubject(m.subjectId); return m.score >= (s? s.pass : DB.settings.defaultPass); })};
}
function classRank(studentId, examId){
  var ex=findExam(examId); var s=findStudent(studentId); if(!ex||!s) return null;
  var peers=activeStudents().filter(function(x){return x.grade===s.grade&&x.section===s.section;}).map(function(x){ return {id:x.id, pct:resultSummary(x.id, examId).pct}; }).sort(function(a,b){return b.pct-a.pct;});
  for(var i=0;i<peers.length;i++) if(peers[i].id===studentId) return i+1;
  return null;
}
function reportCardHTML(s, ex, ms, showPrintBtn){
  var sum=resultSummary(s.id, ex.id);
  var rows=ms.map(function(m){ var sj=findSubject(m.subjectId); return '<tr><td>'+esc(subjName(sj))+'</td><td>'+m.score+'</td><td>'+(sj?sj.max:100)+'</td><td>'+(m.score>=(sj?sj.pass:40)? esc(t("pass")):esc(t("fail")))+'</td></tr>'; }).join("");
  var rank = DB.settings.showRank? classRank(s.id, ex.id):null;
  return '<div class="reportcard"><div style="text-align:center"><div style="display:flex;justify-content:center">'+logoLockupHTML(58)+'</div><h2 style="margin:.2rem 0">'+esc(schoolName())+'</h2><div class="small">SHOLANI HIGH SCHOOL — '+esc(DB.settings.address)+'</div><h3>'+esc(t("reportCard"))+' — '+esc(examName(ex))+' ('+esc(ex.year)+')</h3></div>'
  +'<dl class="kv"><dt>'+esc(t("name"))+'</dt><dd>'+esc(s.name)+'</dd><dt>'+esc(t("father"))+'</dt><dd>'+esc(s.father)+'</dd><dt>ID</dt><dd>'+esc(s.id)+'</dd><dt>'+esc(t("grade"))+'</dt><dd>'+s.grade+'-'+esc(s.section)+'</dd></dl>'
  +'<table style="margin-top:.6rem"><tr><th>'+esc(t("subject"))+'</th><th>'+esc(t("marks"))+'</th><th>'+esc(t("maxMarks"))+'</th><th>'+esc(t("status"))+'</th></tr>'+rows
  +'<tr><th>'+esc(t("total"))+'</th><th>'+sum.got+'</th><th>'+sum.max+'</th><th>'+sum.pct+'% — '+(sum.pass? esc(t("pass")):esc(t("fail")))+'</th></tr></table>'
  +(rank? '<p><strong>'+esc(t("classRank"))+':</strong> '+rank+'</p>':"")
  +'<p><strong>'+esc(t("teacherRemarks"))+':</strong> '+(ms[0]&&ms[0].remarks? esc(ms[0].remarks):"—")+'</p>'
  +'<div class="grid c2" style="margin-top:1rem"><div><div class="sigline">'+esc(t("principalSign"))+'<br>'+esc(DB.settings.principalName||"")+'</div></div><div><div class="stamp">'+esc(t("stampArea"))+'<br>'+esc(schoolName())+'</div></div></div></div>'
  +(showPrintBtn? '<div class="center mt"><button class="btn gold" onclick="printReportCard(\''+s.id+'\',\''+ex.id+'\')">'+esc(t("print"))+'</button></div>':"");
}
function printReportCard(sid, exid){ var s=findStudent(sid), ex=findExam(exid); if(!s||!ex) return; var ms=DB.marks.filter(function(m){return m.examId===exid&&m.studentId===sid;}); printHTML(reportCardHTML(s, ex, ms, false)); }
function reportCardPicker(){
  var ex=findExam(exSel.examId); if(!ex) return;
  var studs=activeStudents().filter(function(s){ return DB.marks.some(function(m){return m.examId===ex.id&&m.studentId===s.id;}); });
  openModal('<h3>'+esc(t("reportCard"))+' — '+esc(examName(ex))+'</h3>'+(studs.length? studs.map(function(s){ var sum=resultSummary(s.id, ex.id); return '<div class="row spread" style="border-top:1px solid var(--border);padding:.4rem 0"><span>'+esc(s.name)+' ('+esc(s.id)+') — '+sum.pct+'%</span><button class="btn small gold" onclick="closeModal();openReportCard(\''+s.id+'\',\''+ex.id+'\')">'+esc(t("view"))+'</button></div>'; }).join("") : '<span class="muted">'+esc(t("noData"))+'</span>')+'<div class="row mt"><button class="btn ghost" onclick="closeModal()">'+esc(t("close"))+'</button></div>');
}
function openReportCard(sid, exid){ var s=findStudent(sid), ex=findExam(exid); var ms=DB.marks.filter(function(m){return m.examId===exid&&m.studentId===sid;}); openModal(reportCardHTML(s, ex, ms, true), true); }

/* ================= امنیت — Security (v6 ONLINE only) =================
   - ننوتل: ۵ ناکامې هڅې → ۱۵ دقیقې بندېز (localStorage کې خوندي، پاڼه بیا
     خلاصېدو سره هم پاتې کېږي؛ ۱۵ دقیقې وروسته هڅې صفرېږي).
   - ناسته: ۳۰ دقیقې بې‌کاره کېدل → اتومات وتل؛ بیا خلاصېدو سره بیا ننوتل
     اړین دي (هېڅ saved session نشته).
   - پټ نوم هېڅکله په پاڼه کې نه ښکاري.
   ==================================================================== */
var LOCK_KEY="sholani_online_lock_v1";
var LOCK_MAX_TRIES=5, LOCK_MINUTES=15;
var SESSION_TIMEOUT_MS=30*60*1000;
var _lastActivity=Date.now(), _idleTimer=null;
function lockState(){ try{ var st=JSON.parse(localStorage.getItem(LOCK_KEY)||"null"); return st||{fails:0, lockUntil:0}; }catch(e){ return {fails:0, lockUntil:0}; } }
function saveLock(st){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify(st)); }catch(e){} }
function lockRemainingMs(){ var st=lockState(); if(st.lockUntil && Date.now()<st.lockUntil) return st.lockUntil-Date.now(); if(st.lockUntil && Date.now()>=st.lockUntil){ saveLock({fails:0, lockUntil:0}); return 0; } return 0; }
function lockMsg(){ var m=Math.ceil(lockRemainingMs()/60000); return t("lockout")+" — "+m+" "+t("minLeft"); }
function noteActivity(){ _lastActivity=Date.now(); if(_idleTimer){ clearTimeout(_idleTimer); _idleTimer=null; } if(UI.user){ _idleTimer=setTimeout(function(){ if(UI.user && Date.now()-_lastActivity>=SESSION_TIMEOUT_MS){ doLogout(); toast(t("sessionExpired")); } }, SESSION_TIMEOUT_MS); } }
["click","keydown","input","touchstart"].forEach(function(ev){ document.addEventListener(ev, function(){ if(UI.user) noteActivity(); }, {passive:true}); });

/* ================= آنلاین طبقه — ONLINE layer (v6) =================
   ځواب د جاوید پوښتنې ته: "که اپلوډ د وېب‌سایټ له لارې وي، ایا هر څوک یې کولی شي؟"
   ځواب: نه — اپلوډ یوازې مدیر کولی شي.
   - په عامه پاڼو کې هېڅ اپلوډ بټن نشته (عامه خلک یوازې ګوري).
   - اپلوډ یوازې د مدیر په اډمین پینل کې دی، د manager لاګین تر شا.
   - په بیک‌اینډ کې هم RLS دی: عامه خلک یوازې لوستلی شي؛ لیکنه یوازې
     authenticated مدیر کولی شي (وګورئ supabase-setup.sql). هېڅ anonymous

/* v6.3: shrink big phone photos before saving — a full-size phone photo
   (3–6 MB) as base64 used to blow the ~5 MB localStorage quota, so the save
   failed silently and the photo vanished on reload. Photos are resized to
   max 1280px (JPEG 0.82). Videos cannot be shrunk, so the 8 MB demo limit
   still applies to them. GIFs are left untouched (resizing would kill animation). */
function onlinePrepareFile(file, cb){
  if(file.type.indexOf("image/")!==0 || file.type==="image/gif"){ var r0=new FileReader(); r0.onload=function(){ cb(r0.result); }; r0.onerror=function(){ cb(null); }; r0.readAsDataURL(file); return; }
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      try{
        var max=1280, sc=Math.min(1, max/Math.max(img.width,img.height));
        var c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.82));
      }catch(e){ cb(rd.result); }
    };
    img.onerror=function(){ cb(rd.result); };
    img.src=rd.result;
  };
  rd.onerror=function(){ toast("فایل ونه لوستل شو / Could not read the file"); cb(null); };
  rd.readAsDataURL(file);
}

  + '</div>';
}
function onlineFileChanged(){ var f=document.getElementById("onFile"); var row=document.getElementById("onFileRow"); var nm=document.getElementById("onFileName"); if(f&&f.files&&f.files[0]){ if(nm) nm.textContent="✓ "+f.files[0].name+" ("+Math.round(f.files[0].size/1024)+" KB)"; if(row) row.style.display="flex"; } else if(row){ row.style.display="none"; } }
function onlineClearFile(){ var f=document.getElementById("onFile"); if(f) f.value=""; var row=document.getElementById("onFileRow"); if(row) row.style.display="none"; var nm=document.getElementById("onFileName"); if(nm) nm.textContent=""; toast(t("fileRemoved")); }
function onlineUploadSave(kind){
  if(!onlineIsManager()){ toast(t("noPermission")); return; }
  if(!guard("announcements","create")) return;
  function val(id){ var el=document.getElementById(id); return el? el.value.trim() : ""; }
  var tps=val("onTitle_ps"), tfa=val("onTitle_fa"), ten=val("onTitle_en");
  var bps=val("onBody_ps"), bfa=val("onBody_fa"), ben=val("onBody_en");
  var title=tps||tfa||ten;
  var fileEl=document.getElementById("onFile");
  var file=fileEl && fileEl.files && fileEl.files[0];
  if(!title){ toast(t("required")); return; }
  if(!file){ toast("لومړی عکس یا ویډیو وټاکئ — Please choose a photo or video first"); return; }
  if(ONLINE_ALLOWED_TYPES.indexOf(file.type)===-1){ toast("دا ډول فایل نه منل کېږي — یوازې عکس (JPG, PNG, WebP, GIF) یا ویډیو (MP4, WebM) اجازه لري / Only JPG/PNG/WebP/GIF photos or MP4/WebM videos are allowed"); return; }
  if(file.size>50*1024*1024){ toast("فایل ډېر لوی دی — تر ۵۰ MB پورې اجازه ده / File too large, max 50 MB"); return; }
  var isVideo=file.type.indexOf("video")===0;
  if(isVideo) toast("ویډیو دې لنډه وي (<۲ دقیقې) — وړیا ذخیره یوازې ۱ GB ده");
  if(ONLINE.DEMO_MODE && isVideo && file.size>8*1024*1024){ toast("ډیمو حالت کې ویډیو دې تر ۸ MB کمه وي (localStorage محدودیت) — لوی فایل لپاره Supabase وصل کړئ / In demo mode keep videos under 8 MB"); return; }
  var mediaType=isVideo?"video":"photo";
  var done=function(url){
    var item={id:uid("OG"), title:title, title_ps:tps||title, title_fa:tfa||title, title_en:ten||title, body:bps||"", body_ps:bps||"", body_fa:bfa||"", body_en:ben||"", media_url:url, image_url:isVideo?null:url, media_type:mediaType, published:true, created_at:todayStr()};
    /* v6.3: gallery photos are stored ONLY in ONLINE.shared.gallery (the public
       Gallery reads that first). The old code ALSO pushed the full photo into
       DB.settings.sitePhotos, doubling localStorage use and blowing the quota. */
    if(kind==="announcement"){ ONLINE.shared.announcements.unshift(item); DB.announcements.unshift({id:item.id, title:title, desc:bps||"", date:todayStr(), expiry:"", published:true, img:null, sample:false}); }
    else { ONLINE.shared.gallery.unshift(item); }
    var okDemo=true, okDB=true;
    if(ONLINE.DEMO_MODE){ okDemo=onlineSaveDemo(); okDB=saveDB(); }
    else { okDB=saveDB(); }
    /* v6.3: VERIFY the save really persisted — localStorage quota used to fail
       silently, so the photo showed until reload and then vanished. */
    var okVerify=onlineVerifySaved(item.id, kind);
    audit("create","announcements","online "+kind+(ONLINE.DEMO_MODE?" (DEMO)":"")+": "+title);
    if(ONLINE.DEMO_MODE && (!okDemo || !okDB || !okVerify)){
      if(kind==="gallery"){ ONLINE.shared.gallery=ONLINE.shared.gallery.filter(function(x){return x.id!==item.id;}); }
      else { ONLINE.shared.announcements=ONLINE.shared.announcements.filter(function(x){return x.id!==item.id;}); }
      onlineSaveDemo(); saveDB();
      toast("خوندي نه شو — فایل ډېر لوی دی؛ کوچنی عکس وټاکئ / Could not save — file too large, please choose a smaller photo");
      renderApp(); return;
    }
    toast(ONLINE.DEMO_MODE ? "خوندي شو ✓ — په دې وسیله کې په عامه ګالري کې ښکاري / Saved — visible in the public gallery on this device" : t("saved"));
    renderApp();
  };
  if(ONLINE.DEMO_MODE){
    onlinePrepareFile(file, function(dataUrl){
      if(!dataUrl){ toast("فایل ونه لوستل شو / Could not read the file"); return; }
      if(dataUrl.length>3500000){ toast("عکس ډېر لوی دی — کوچنی عکس وټاکئ / Photo too large — please choose a smaller photo"); return; }
      done(dataUrl);
    });
    return;
  }
  /* Real Supabase path — only runs when config.js has real keys */
  (async function(){
    try{
      var path="gallery/"+onlineSafeName(file.name);
      var up=await ONLINE.client.storage.from(ONLINE_CONFIG.BUCKET).upload(path, file);
      if(up.error){ toast(t("uploadFailed")+": "+up.error.message); return; }
      var pub=ONLINE.client.storage.from(ONLINE_CONFIG.BUCKET).getPublicUrl(path);
      var url=pub.data.publicUrl;
      if(kind==="announcement"){ var ins=await ONLINE.client.from("announcements").insert([{title:title, title_ps:tps||title, title_fa:tfa||title, title_en:ten||title, body:bps||"", body_ps:bps||"", body_fa:bfa||"", body_en:ben||"", image_url:isVideo?null:url, published:true}]); if(ins.error){ toast(t("saveFailed")+": "+ins.error.message); return; } }
      else { var ins2=await ONLINE.client.from("gallery_items").insert([{title:title, title_ps:tps||title, title_fa:tfa||title, title_en:ten||title, media_url:url, media_type:mediaType}]); if(ins2.error){ toast(t("saveFailed")+": "+ins2.error.message); return; } }
      done(url);
    }catch(e){ toast(t("uploadFailed")+": "+(e&&e.message?e.message:e)); }
  })();
}
function onlineDeleteItem(id, kind){
  if(!onlineIsManager()){ toast(t("noPermission")); return; }
  if(!guard("announcements","delete")) return;
  askCheck(id, function(ok){
    if(!ok) return;
    if(kind==="gallery"){ ONLINE.shared.gallery=ONLINE.shared.gallery.filter(function(x){return x.id!==id;}); DB.settings.sitePhotos=DB.settings.sitePhotos.filter(function(p){return p.id!==id;}); }
    else { ONLINE.shared.announcements=ONLINE.shared.announcements.filter(function(x){return x.id!==id;}); DB.announcements=DB.announcements.filter(function(a){return a.id!==id;}); }
    if(ONLINE.DEMO_MODE){ onlineSaveDemo(); }
    else if(ONLINE.client){ if(kind==="gallery") ONLINE.client.from("gallery_items").delete().eq("id",id); else ONLINE.client.from("announcements").delete().eq("id",id); }
    audit("delete","announcements","online "+kind+" "+id); saveDB(); toast(t("deleted")); renderApp();
  });
}

/* ================= پیل — Init ================= */
loadDB();
try{ localStorage.removeItem(SESSION_KEY); localStorage.removeItem("sholani_school_session"); sessionStorage.clear(); }catch(e){}
UI.user=null; UI.view="public";
applyLook();
if(typeof onlineInit==="function"){ try{ onlineInit(); }catch(e){} }
render();
</script>
